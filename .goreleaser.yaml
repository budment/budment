version: 2

project_name: budment

builds:
  - id: budment
    dir: apps/core
    main: ./cmd
    binary: budment
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

dockers_v2:
  - id: budment-docker
    dockerfile: apps/core/Dockerfile
    images:
      - "budment/budment"
    tags:
      - "latest"
      - "v{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
    annotations:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.title": "{{.ProjectName}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"

archives:
  - id: default
    name_template: "budment_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  abbrev: -1
  format: "{{ .Message }}"
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^Merge pull request"
  groups:
    - title: "Features"
      regexp: '^.*?feat(\([\w\s]+\))?!?:'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*?fix(\([\w\s]+\))?!?:'
      order: 1
    - title: "Performance Improvements"
      regexp: '^.*?perf(\([\w\s]+\))?!?:'
      order: 2
    - title: "Others"
      order: 999
