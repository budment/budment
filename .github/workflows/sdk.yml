name: SDK CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'packages/sdk/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/sdk.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'packages/sdk/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/sdk.yml'

jobs:
  build-sdk:
    name: Build TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @blaster/sdk build