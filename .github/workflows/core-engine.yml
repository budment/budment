name: Core Engine CI

on:
  push:
    branches: [main, master]
    paths:
      - "apps/core/**"
      - ".github/workflows/core-engine.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "apps/core/**"
      - ".github/workflows/core-engine.yml"

jobs:
  lint:
    name: Lint Core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: apps/core/go.sum
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          working-directory: apps/core
          install-mode: goinstall
          args: --config=.golangci.yml

  test:
    name: Test & Race Detection
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: apps/core/go.sum
      - run: go test -v -race -timeout 5m ./...
