name: Core Engine CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read

jobs:
  filter:
    name: Check Changes
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.changes.outputs.core }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            core:
              - "apps/core/**"
              - ".github/workflows/core-engine.yml"

  lint:
    name: Lint Core
    needs: filter
    if: ${{ needs.filter.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: apps/core/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: apps/core
          args: --config=.golangci.yml

  test:
    name: Test Core
    needs: filter
    if: ${{ needs.filter.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: apps/core/go.sum
      - run: go test -v -race -timeout 5m ./...
