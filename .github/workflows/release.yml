name: Release

on:
  push:
    tags:
      - "v0.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  goreleaser:
    name: Release Go CLI & Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: apps/core/go.sum

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-sdk:
    name: Publish TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check existing version on NPM
        id: check-version
        run: |
          TARGET_VERSION="${GITHUB_REF_NAME#v}"
          if npm view "@budment/sdk@${TARGET_VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version ${TARGET_VERSION} is already published on NPM. Skipping publish step."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync package version
        if: steps.check-version.outputs.exists != 'true'
        run: pnpm --filter "@budment/sdk" exec npm version ${GITHUB_REF_NAME#v} --no-git-tag-version --allow-same-version

      - name: Build TypeScript SDK
        if: steps.check-version.outputs.exists != 'true'
        run: pnpm --filter "@budment/sdk" build

      - name: Publish to NPM
        if: steps.check-version.outputs.exists != 'true'
        run: pnpm --filter "@budment/sdk" publish --no-git-checks --access public --provenance
