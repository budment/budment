name: Release

on:
  push:
    tags:
      - "v0.*"

permissions:
  contents: write 
  id-token: write

jobs:
  goreleaser:
    name: Release Go CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 
          
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: apps/core/go.sum
          
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-sdk:
    name: Publish TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"
          
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@budment/sdk" exec npm version ${GITHUB_REF_NAME#v} --no-git-tag-version --allow-same-version
      - run: pnpm --filter "@budment/sdk" build
      - run: pnpm --filter "@budment/sdk" publish --no-git-checks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}