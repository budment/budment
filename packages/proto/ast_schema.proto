syntax = "proto3";

package budment.ast.v1;

option go_package = "github.com/budment/budment/core/pkg/pb/ast";

message Scenario {
  string         name      = 1;
  Pipeline       setup     = 2;
  Pipeline       execution = 3;
  ScenarioConfig config    = 4;
  Pipeline       teardown  = 5;
}

message ScenarioConfig {
  // Number of concurrent virtual users. Defaults to 1.
  optional int32 vus = 1;
  // Scenario run duration. Stops when reached.
  optional string duration = 2;
  // Hard upper limit for the entire scenario.
  optional string max_duration = 3;
  // Number of iterations to execute. Defaults to 1.
  optional int32 iterations = 4;
  // Exact time to start the scenario. Takes precedence over order.
  optional string start_at = 5;
  // Execution order. Scenarios with the same order start together.
  optional int32 order = 6;
  // Optional load stages for gradually changing VUs.
  repeated Stage stages = 7;
  // Pass/fail conditions for scenario metrics.
  map<string, string> thresholds = 8;
  // Custom metadata attached to the scenario.
  map<string, string> tags = 9;
  // Disable TLS certificate verification.
  optional bool insecure_skip_tls_verify = 10;
}

message Stage {
  // Duration of this stage.
  string duration = 1;
  // Target number of virtual users.
  int32 target = 2;
}

message Pipeline {
  repeated Node steps = 1;
}

message Node {
  string id = 1;

  oneof type {
    ActionNode     action     = 2;
    BranchNode     branch     = 3;
    MatchNode      match      = 4;
    LoopNode       loop       = 5;
    PollNode       poll       = 6;
    ScriptNode     script     = 7;
    SleepNode      sleep      = 8;
    LogNode        log        = 9;
    BarrierNode    barrier    = 10;
    SetNode        set        = 11;
    DistributeNode distribute = 12;
    MetricNode     metric     = 13;
    ReqMutateNode  req_mutate = 14;
    ResAssertNode  res_assert = 15;
    TagNode        tag        = 16;
  }
}

message ActionNode {
  string   protocol = 1;
  string   method   = 2;
  string   target   = 3;
  Pipeline before   = 4;
  Pipeline after    = 5;
}

message ReqMutateNode {
  map<string, string> metadata = 1;
  string              payload  = 2;
}

message ResAssertNode {
  int32               expect_code             = 1;
  string              expect_payload_contains = 2;
  map<string, string> extract                 = 4;
}

message BranchNode {
  string   condition_hook_id = 1;
  Pipeline true_path         = 2;
  Pipeline false_path        = 3;
}

message MatchNode {
  string                condition_hook_id = 1;
  map<string, Pipeline> cases             = 2;
  Pipeline              default_path      = 3;
}

message LoopNode {
  oneof config {
    int32       count         = 1;
    RangeConfig range         = 2;
    string      array_hook_id = 3;
  }

  Pipeline logic = 4;

  message RangeConfig {
    int32 from = 1;
    int32 to   = 2;
  }
}

message PollNode {
  string     condition_hook_id = 1;
  Pipeline   logic             = 2;
  PollPolicy policy            = 3;
}

message PollPolicy {
  string interval     = 1;
  string timeout      = 2;
  int32  max_attempts = 3;
}

message ScriptNode {
  string hook_id = 1;
}

message SleepNode {
  double duration_s = 1;
}

message LogNode {
  string message = 1;
}

message BarrierNode {
  string name   = 1;
  int32  quorum = 2;
}

message SetNode {
  string key        = 1;
  string value_json = 2;
  string scope      = 3;
}

message DistributeNode {
  string key        = 1;
  string items_json = 2;
}

message MetricNode {
  string metric_type = 1;
  string name        = 2;
  string value       = 3;
}

message TagNode {
  string key   = 1;
  string value = 2;
}