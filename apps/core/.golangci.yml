version: "2"

run:
  go: "1.26"
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - durationcheck
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - makezero
    - noctx
    - staticcheck
    - unused
    - nilerr  
    - prealloc 
    - asasalint 
    - unparam 
    - gocritic 

  settings:
    errcheck:
      exclude-functions:
        - io.WriteString
        - (*os.File).WriteString
        - (io.Closer).Close
        - (*github.com/dop251/goja.Runtime).Set
        - (*mime/multipart.Writer).Close
        - (mime/multipart.File).Close
    gocritic:
      enabled-tags:
        - performance
        - diagnostic
      disabled-checks:
        - ifElseChain
      settings:
        hugeParam:
          sizeThreshold: 300

  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
          - noctx
          - unparam
        path: _test\.go
    paths:
      - .*\.pb\.go$
      - .*_mock\.go$
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go$
      - .*_mock\.go$
      - third_party$
      - builtin$
      - examples$
