version: "2"
run:
  go: "1.26"
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - durationcheck
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - makezero
    - noctx
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        - io.WriteString
        - (*os.File).WriteString
        - (io.Closer).Close
        - (*github.com/dop251/goja.Runtime).Set
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
          - noctx
        path: _test\.go
    paths:
      - .*\.pb\.go$
      - .*_mock\.go$
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go$
      - .*_mock\.go$
      - third_party$
      - builtin$
      - examples$
